[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smsgora"
version = "1.0.2"
description = "SMS Gora SMS Gateway: official Python client by Tekservix. Send and receive SMS through your own Android phones, with delivery reports and signed webhooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tekservix", email = "support@tekservix.com" }]
requires-python = ">=3.8"
keywords = ["sms", "sms-api-gateway", "sms-gateway", "sms-api", "bulk-sms", "send-sms", "android-sms-gateway", "otp", "textbee", "smsgora", "tekservix"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Communications :: Telephony",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://tekservix.com/smsgora/"
Documentation = "https://tekservix.com/smsgora/docs/"
Source = "https://github.com/tekservixhq/smsgora-python"
Issues = "https://github.com/tekservixhq/smsgora-python/issues"
